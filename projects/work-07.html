<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Pixel World - 2D Platformer</title>
    <!-- Tailwind CSS for UI Overlay -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js for Retro Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Font Awesome for UI Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Retro Pixel Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #0f172a;
            margin: 0;
            padding: 0;
            overflow: hidden;
            color: #ffffff;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #5c94fc;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .pixel-shadow {
            text-shadow: 3px 3px 0px #000;
        }
        .retro-btn {
            background-color: #e53e3e;
            border: 4px solid #fff;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.1s ease;
        }
        .retro-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }
        .touch-btn {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            touch-action: none;
        }
        .touch-btn:active, .touch-btn.active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas Element -->
        <canvas id="gameCanvas"></canvas>

        <!-- Top UI Bar -->
        <div class="absolute top-4 left-4 right-4 flex justify-between items-center text-xs md:text-sm pixel-shadow pointer-events-none z-10">
            <div class="flex gap-4 md:gap-8">
                <div>MARIO<br><span id="scoreText" class="text-yellow-300">000000</span></div>
                <div>COINS<br><span class="text-yellow-400">🪙 x<span id="coinsText">00</span></span></div>
            </div>
            <div class="flex gap-4 md:gap-8 text-right">
                <div>WORLD<br><span id="worldText" class="text-green-400">1-1</span></div>
                <div>TIME<br><span id="timeText" class="text-white">400</span></div>
                <div>LIVES<br><span class="text-red-400">❤️ x<span id="livesText">3</span></span></div>
            </div>
        </div>

        <!-- Start / Game Over / Level Complete Overlay -->
        <div id="overlay" class="absolute inset-0 bg-black/80 flex flex-col justify-center items-center text-center z-20 p-4">
            <h1 id="overlayTitle" class="text-3xl md:text-5xl text-yellow-400 mb-4 pixel-shadow tracking-widest">SUPER MARIO BROS</h1>
            <p id="overlaySubtitle" class="text-sm md:text-base text-gray-300 mb-8 max-w-md leading-relaxed">
                Use <span class="text-yellow-300">A/D</span> or <span class="text-yellow-300">Arrow Keys</span> to move, <span class="text-yellow-300">W / Space</span> to jump! Jump on enemies to defeat them. Reach the flag to unlock the next level!
            </p>
            <button id="startBtn" class="retro-btn px-8 py-4 text-sm md:text-lg text-white font-bold tracking-wider rounded">
                START GAME
            </button>
        </div>

        <!-- Touch Controls (Mobile) -->
        <div id="touchControls" class="absolute bottom-6 left-6 right-6 justify-between items-end pointer-events-auto hidden z-10">
            <div class="flex gap-3">
                <button id="btnLeft" class="touch-btn w-16 h-16"><i class="fas fa-arrow-left"></i></button>
                <button id="btnRight" class="touch-btn w-16 h-16"><i class="fas fa-arrow-right"></i></button>
            </div>
            <div class="flex gap-3">
                <button id="btnJump" class="touch-btn w-20 h-20 bg-red-500/40 border-red-300"><i class="fas fa-arrow-up"></i></button>
            </div>
        </div>
    </div>

    <script>
        // --- SOUND ENGINE (Tone.js) ---
        const Sound = {
            synth: null,
            polySynth: null,
            initialized: false,
            
            init() {
                if (this.initialized) return;
                try {
                    this.synth = new Tone.Synth().toDestination();
                    this.polySynth = new Tone.PolySynth().toDestination();
                    this.synth.volume.value = -12;
                    this.polySynth.volume.value = -14;
                    this.initialized = true;
                } catch (e) { console.error("Audio init error", e); }
            },
            
            jump() {
                if (!this.initialized) return;
                const now = Tone.now();
                this.synth.triggerAttackRelease("C4", "8n", now);
                this.synth.triggerAttackRelease("G4", "8n", now + 0.08);
            },
            
            coin() {
                if (!this.initialized) return;
                const now = Tone.now();
                this.synth.triggerAttackRelease("B5", "16n", now);
                this.synth.triggerAttackRelease("E6", "8n", now + 0.08);
            },
            
            stomp() {
                if (!this.initialized) return;
                this.synth.triggerAttackRelease("G2", "16n");
            },

            powerUp() {
                if (!this.initialized) return;
                const now = Tone.now();
                ["G4", "B4", "D5", "G5"].forEach((note, i) => {
                    this.synth.triggerAttackRelease(note, "16n", now + i * 0.06);
                });
            },
            
            bump() {
                if (!this.initialized) return;
                this.synth.triggerAttackRelease("A2", "16n");
            },

            hurt() {
                if (!this.initialized) return;
                const now = Tone.now();
                this.synth.triggerAttackRelease("E3", "16n", now);
                this.synth.triggerAttackRelease("C3", "16n", now + 0.08);
            },
            
            win() {
                if (!this.initialized) return;
                const now = Tone.now();
                ["C4", "E4", "G4", "C5", "E5", "G5"].forEach((n, i) => {
                    this.synth.triggerAttackRelease(n, "8n", now + i * 0.1);
                });
            }
        };

        // --- GAME ENGINE & SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GAME_WIDTH = 800;
        const GAME_HEIGHT = 450;
        const TILE_SIZE = 32;
        const GRAVITY = 0.55;

        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        function resizeCanvas() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const scale = Math.min(windowWidth / GAME_WIDTH, windowHeight / GAME_HEIGHT);
            
            canvas.style.width = `${GAME_WIDTH * scale}px`;
            canvas.style.height = `${GAME_HEIGHT * scale}px`;

            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById('touchControls').classList.remove('hidden');
                document.getElementById('touchControls').classList.add('flex');
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- GAME STATE & LEVEL SYSTEM ---
        let gameState = 'START'; // START, PLAYING, GAMEOVER, LEVEL_WIN, GAME_WIN
        let currentWorld = 1;
        let currentSubLevel = 1;
        let score = 0;
        let coins = 0;
        let lives = 3;
        let gameTimer = 400;
        let timerInterval = null;
        let cameraX = 0;

        const keys = { left: false, right: false, jump: false, jumpPressed: false };

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
                if (!keys.jump) keys.jumpPressed = true;
                keys.jump = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.jump = false;
        });

        function bindTouch(btnId, keyName) {
            const btn = document.getElementById(btnId);
            const start = (e) => {
                e.preventDefault();
                if (keyName === 'jump' && !keys.jump) keys.jumpPressed = true;
                keys[keyName] = true;
                btn.classList.add('active');
            };
            const end = (e) => {
                e.preventDefault();
                keys[keyName] = false;
                btn.classList.remove('active');
            };
            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', end);
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
        }
        bindTouch('btnLeft', 'left');
        bindTouch('btnRight', 'right');
        bindTouch('btnJump', 'jump');

        // --- ENHANCED MARIO PLAYER (NES FIRE MARIO PALETTE & DETAILED PIXEL ART) ---
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 24;
                this.height = 32;
                this.vx = 0;
                this.vy = 0;
                this.speed = 4.0;
                this.jumpStrength = -11.8;
                this.grounded = false;
                this.facing = 'right';
                this.isSuper = false;
                this.invulnerableTimer = 0;
                this.animFrame = 0;
                this.animTimer = 0;
            }

            update(map) {
                if (keys.left) {
                    this.vx = -this.speed;
                    this.facing = 'left';
                } else if (keys.right) {
                    this.vx = this.speed;
                    this.facing = 'right';
                } else {
                    this.vx *= 0.8;
                    if (Math.abs(this.vx) < 0.1) this.vx = 0;
                }

                if (keys.jumpPressed && this.grounded) {
                    this.vy = this.jumpStrength;
                    this.grounded = false;
                    Sound.jump();
                }
                keys.jumpPressed = false;

                this.vy += GRAVITY;

                if (this.invulnerableTimer > 0) this.invulnerableTimer--;

                this.x += this.vx;
                this.checkCollisionX(map);

                this.y += this.vy;
                this.checkCollisionY(map);

                if (this.y > GAME_HEIGHT + 100) {
                    playerHurt(true);
                }

                if (this.vx !== 0) {
                    this.animTimer++;
                    if (this.animTimer % 6 === 0) {
                        this.animFrame = (this.animFrame + 1) % 3;
                    }
                } else {
                    this.animFrame = 0;
                }
            }

            checkCollisionX(map) {
                const bounds = this.getBounds();
                for (let tile of map.getTilesNear(this.x, this.y)) {
                    if (tile.solid && isColliding(bounds, tile.getBounds())) {
                        if (this.vx > 0) this.x = tile.x - this.width;
                        else if (this.vx < 0) this.x = tile.x + tile.width;
                        this.vx = 0;
                    }
                }
            }

            checkCollisionY(map) {
                this.grounded = false;
                const bounds = this.getBounds();
                for (let tile of map.getTilesNear(this.x, this.y)) {
                    if (tile.solid && isColliding(bounds, tile.getBounds())) {
                        if (this.vy > 0) {
                            this.y = tile.y - this.height;
                            this.vy = 0;
                            this.grounded = true;
                        } else if (this.vy < 0) {
                            this.y = tile.y + tile.height;
                            this.vy = 0;
                            tile.onHitFromBelow();
                        }
                    }
                }
            }

            getBounds() {
                return { x: this.x, y: this.y, width: this.width, height: this.height };
            }

            grow() {
                if (!this.isSuper) {
                    this.isSuper = true;
                    this.height = 42;
                    this.y -= 10;
                    Sound.powerUp();
                }
            }

            shrink() {
                this.isSuper = false;
                this.height = 32;
                this.invulnerableTimer = 60;
                Sound.hurt();
            }

            draw(ctx) {
                if (this.invulnerableTimer % 4 >= 2) return;

                ctx.save();
                ctx.translate(Math.floor(this.x - cameraX), Math.floor(this.y));

                if (this.facing === 'left') {
                    ctx.scale(-1, 1);
                    ctx.translate(-this.width, 0);
                }

                // NES Fire Mario Palette (matching the attached screenshot: White Cap/Shirt, Brown Overalls)
                const hatColor = this.isSuper ? '#ffffff' : '#fce7f3';
                const shirtColor = '#ffffff';
                const overallsColor = '#b45309'; // Brown overalls
                const skinColor = '#fca5a5';     // Classic Peach skin
                const hairColor = '#6b21a8';

                const h = this.height;

                // Overalls / Body
                ctx.fillStyle = overallsColor;
                ctx.fillRect(4, h - 22, 16, 16);

                // Shirt/Arms
                ctx.fillStyle = shirtColor;
                ctx.fillRect(2, h - 20, 4, 12);
                ctx.fillRect(18, h - 20, 4, 12);

                // Head
                ctx.fillStyle = skinColor;
                ctx.fillRect(4, 4, 16, 12);

                // Sideburns / Mustache
                ctx.fillStyle = hairColor;
                ctx.fillRect(2, 8, 4, 6);
                ctx.fillRect(10, 11, 10, 4); // Mustache

                // Cap (NES Style White Cap)
                ctx.fillStyle = hatColor;
                ctx.fillRect(2, 0, 18, 6);
                ctx.fillRect(6, 2, 14, 4);

                // Eyes
                ctx.fillStyle = '#000000';
                ctx.fillRect(14, 6, 3, 4);

                // Shoes / Running Animation
                ctx.fillStyle = overallsColor;
                if (!this.grounded) {
                    ctx.fillRect(0, h - 6, 8, 6);
                    ctx.fillRect(14, h - 4, 8, 4);
                } else if (this.animFrame === 1) {
                    ctx.fillRect(0, h - 6, 10, 6);
                    ctx.fillRect(12, h - 4, 8, 4);
                } else if (this.animFrame === 2) {
                    ctx.fillRect(2, h - 4, 8, 4);
                    ctx.fillRect(12, h - 6, 10, 6);
                } else {
                    ctx.fillRect(2, h - 6, 8, 6);
                    ctx.fillRect(14, h - 6, 8, 6);
                }

                ctx.restore();
            }
        }

        // --- ENEMIES (Goombas & Spiny/Lakitu) ---
        class Enemy {
            constructor(x, y, type = 'goomba') {
                this.x = x;
                this.y = y;
                this.width = 28;
                this.height = 28;
                this.type = type; // 'goomba', 'spiny'
                this.vx = -1.2;
                this.vy = 0;
                this.alive = true;
                this.squished = false;
                this.squishTimer = 0;
            }

            update(map) {
                if (this.squished) {
                    this.squishTimer++;
                    if (this.squishTimer > 30) this.alive = false;
                    return;
                }

                this.vy += GRAVITY;
                this.x += this.vx;
                const boundsX = this.getBounds();
                for (let tile of map.getTilesNear(this.x, this.y)) {
                    if (tile.solid && isColliding(boundsX, tile.getBounds())) {
                        this.vx *= -1;
                        this.x += this.vx;
                    }
                }

                this.y += this.vy;
                const boundsY = this.getBounds();
                for (let tile of map.getTilesNear(this.x, this.y)) {
                    if (tile.solid && isColliding(boundsY, tile.getBounds())) {
                        if (this.vy > 0) {
                            this.y = tile.y - this.height;
                            this.vy = 0;
                        }
                    }
                }
            }

            getBounds() {
                return { x: this.x, y: this.y, width: this.width, height: this.height };
            }

            squish() {
                if (this.type === 'spiny') return false; // Spiny cannot be stomped!
                this.squished = true;
                this.height = 10;
                this.y += 18;
                Sound.stomp();
                return true;
            }

            draw(ctx) {
                if (!this.alive) return;

                ctx.save();
                ctx.translate(Math.floor(this.x - cameraX), Math.floor(this.y));

                if (this.squished) {
                    ctx.fillStyle = '#78350f';
                    ctx.fillRect(0, 0, this.width, this.height);
                } else if (this.type === 'spiny') {
                    // Spiny Red Shell with White Spikes (matching Image)
                    ctx.fillStyle = '#dc2626';
                    ctx.fillRect(4, 8, 20, 16);
                    // Spikes
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.moveTo(2, 8); ctx.lineTo(6, 0); ctx.lineTo(10, 8);
                    ctx.moveTo(10, 8); ctx.lineTo(14, 0); ctx.lineTo(18, 8);
                    ctx.moveTo(18, 8); ctx.lineTo(22, 0); ctx.lineTo(26, 8);
                    ctx.fill();
                    // Eyes
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(6, 14, 4, 4);
                    ctx.fillRect(18, 14, 4, 4);
                } else {
                    // Goomba Mushroom Body
                    ctx.fillStyle = '#92400e';
                    ctx.beginPath();
                    ctx.arc(14, 12, 14, Math.PI, 0, false);
                    ctx.fill();
                    ctx.fillRect(4, 12, 20, 12);

                    // Eyes
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(6, 8, 4, 8);
                    ctx.fillRect(18, 8, 4, 8);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(8, 10, 2, 4);
                    ctx.fillRect(18, 10, 2, 4);

                    // Feet
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 22, 10, 6);
                    ctx.fillRect(18, 22, 10, 6);
                }

                ctx.restore();
            }
        }

        // --- LAKITU DECORATION / ENEMY ---
        class Lakitu {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.baseY = y;
                this.floatTimer = 0;
            }

            update() {
                this.floatTimer += 0.05;
                this.y = this.baseY + Math.sin(this.floatTimer) * 12;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(Math.floor(this.x - cameraX), Math.floor(this.y));

                // Cloud Body
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(16, 24, 14, 0, Math.PI * 2);
                ctx.arc(32, 24, 16, 0, Math.PI * 2);
                ctx.arc(48, 24, 14, 0, Math.PI * 2);
                ctx.fill();

                // Lakitu Head / Goggles (matching Image)
                ctx.fillStyle = '#22c55e'; // Green head
                ctx.fillRect(20, 2, 16, 14);
                ctx.fillStyle = '#ffffff'; // Goggles
                ctx.fillRect(18, 4, 20, 6);
                ctx.fillStyle = '#000000';
                ctx.fillRect(22, 6, 4, 4);
                ctx.fillRect(30, 6, 4, 4);

                ctx.restore();
            }
        }

        // Particle FX
        class Particle {
            constructor(x, y, color, vx, vy) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = vx;
                this.vy = vy;
                this.life = 25;
                this.size = Math.random() * 4 + 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.3;
                this.life--;
            }

            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.fillRect(Math.floor(this.x - cameraX), Math.floor(this.y), this.size, this.size);
            }
        }

        // Collectibles
        class Item {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.width = 24;
                this.height = 24;
                this.type = type;
                this.vy = type === 'mushroom' ? -3 : -5;
                this.vx = type === 'mushroom' ? 1.5 : 0;
                this.collected = false;
            }

            update(map) {
                if (this.type === 'coin') {
                    this.y += this.vy;
                    this.vy += 0.4;
                    if (this.vy > 4) this.collected = true;
                } else if (this.type === 'mushroom') {
                    this.vy += GRAVITY;
                    this.x += this.vx;

                    const boundsX = this.getBounds();
                    for (let tile of map.getTilesNear(this.x, this.y)) {
                        if (tile.solid && isColliding(boundsX, tile.getBounds())) {
                            this.vx *= -1;
                            this.x += this.vx;
                        }
                    }

                    this.y += this.vy;
                    const boundsY = this.getBounds();
                    for (let tile of map.getTilesNear(this.x, this.y)) {
                        if (tile.solid && isColliding(boundsY, tile.getBounds())) {
                            if (this.vy > 0) {
                                this.y = tile.y - this.height;
                                this.vy = 0;
                            }
                        }
                    }
                }
            }

            getBounds() {
                return { x: this.x, y: this.y, width: this.width, height: this.height };
            }

            draw(ctx) {
                if (this.collected) return;
                ctx.save();
                ctx.translate(Math.floor(this.x - cameraX), Math.floor(this.y));

                if (this.type === 'coin') {
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    ctx.ellipse(12, 12, 8, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fef08a';
                    ctx.fillRect(10, 4, 4, 16);
                } else if (this.type === 'mushroom') {
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.arc(12, 12, 12, Math.PI, 0, false);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(8, 4, 8, 5);
                    ctx.fillStyle = '#fde047';
                    ctx.fillRect(6, 12, 12, 12);
                }

                ctx.restore();
            }
        }

        // NES TILES (BROWN CRACKED TILES MATCHING SCREENSHOT)
        class Tile {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.width = TILE_SIZE;
                this.height = TILE_SIZE;
                this.type = type; // 'ground', 'brick', 'question', 'pipe', 'flag'
                this.solid = true;
                this.hit = false;
                this.bounceOffset = 0;
            }

            onHitFromBelow() {
                if (this.hit) {
                    Sound.bump();
                    return;
                }

                if (this.type === 'question') {
                    this.hit = true;
                    this.bounceOffset = -8;
                    Sound.coin();
                    coins++;
                    score += 200;
                    
                    const itemType = Math.random() > 0.4 ? 'coin' : 'mushroom';
                    items.push(new Item(this.x + 4, this.y - 24, itemType));

                } else if (this.type === 'brick') {
                    if (player.isSuper) {
                        this.solid = false;
                        Sound.stomp();
                        score += 50;
                        createParticles(this.x + 16, this.y + 16, '#92400e');
                    } else {
                        this.bounceOffset = -6;
                        Sound.bump();
                    }
                }
            }

            update() {
                if (this.bounceOffset < 0) {
                    this.bounceOffset += 1;
                }
            }

            getBounds() {
                return { x: this.x, y: this.y + this.bounceOffset, width: this.width, height: this.height };
            }

            draw(ctx) {
                if (!this.solid && this.type === 'brick') return;

                ctx.save();
                ctx.translate(Math.floor(this.x - cameraX), Math.floor(this.y + this.bounceOffset));

                if (this.type === 'ground') {
                    // NES Classic Brown Ground Tile (matching image_3a9e5a.png)
                    ctx.fillStyle = '#b45309';
                    ctx.fillRect(0, 0, TILE_SIZE, TILE_SIZE);
                    ctx.strokeStyle = '#451a03';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(0, 0, TILE_SIZE, TILE_SIZE);
                    
                    // Cracked pattern lines
                    ctx.beginPath();
                    ctx.moveTo(4, 8); ctx.lineTo(14, 8); ctx.lineTo(14, 18);
                    ctx.moveTo(18, 18); ctx.lineTo(28, 18); ctx.lineTo(28, 28);
                    ctx.stroke();

                } else if (this.type === 'brick') {
                    ctx.fillStyle = '#92400e';
                    ctx.fillRect(0, 0, TILE_SIZE, TILE_SIZE);
                    ctx.strokeStyle = '#451a03';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(0, 0, TILE_SIZE, TILE_SIZE);
                    ctx.beginPath();
                    ctx.moveTo(0, 16); ctx.lineTo(32, 16);
                    ctx.moveTo(16, 0); ctx.lineTo(16, 16);
                    ctx.moveTo(8, 16); ctx.lineTo(8, 32);
                    ctx.stroke();

                } else if (this.type === 'question') {
                    ctx.fillStyle = this.hit ? '#78350f' : '#ea580c';
                    ctx.fillRect(0, 0, TILE_SIZE, TILE_SIZE);
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(0, 0, TILE_SIZE, TILE_SIZE);

                    if (!this.hit) {
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 18px "Press Start 2P"';
                        ctx.fillText('?', 8, 24);
                    }
                } else if (this.type === 'pipe') {
                    // Pipe gradient green
                    ctx.fillStyle = '#22c55e';
                    ctx.fillRect(0, 0, TILE_SIZE, TILE_SIZE);
                    ctx.fillStyle = '#4ade80';
                    ctx.fillRect(4, 0, 6, TILE_SIZE);
                    ctx.strokeStyle = '#15803d';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(0, 0, TILE_SIZE, TILE_SIZE);
                } else if (this.type === 'flag') {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(14, 0, 4, TILE_SIZE);
                    ctx.fillStyle = '#22c55e';
                    ctx.beginPath();
                    ctx.moveTo(18, 0);
                    ctx.lineTo(32, 8);
                    ctx.lineTo(18, 16);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        // LEVEL GENERATION SYSTEM
        class Map {
            constructor() {
                this.tiles = [];
            }

            generate(world, sublevel) {
                this.tiles = [];
                const levelLength = 120 + sublevel * 30;

                for (let x = 0; x < levelLength; x++) {
                    // Gaps / Pits
                    if ((x > 25 && x < 28) || (x > 60 && x < 63) || (x > 95 && x < 98 && sublevel > 1)) continue;

                    // Double ground floor
                    this.tiles.push(new Tile(x * TILE_SIZE, GAME_HEIGHT - TILE_SIZE, 'ground'));
                    this.tiles.push(new Tile(x * TILE_SIZE, GAME_HEIGHT - TILE_SIZE * 2, 'ground'));

                    // Mystery question boxes & Bricks
                    if (x % 14 === 0 && x > 10 && x < levelLength - 20) {
                        this.tiles.push(new Tile(x * TILE_SIZE, GAME_HEIGHT - TILE_SIZE * 5, 'question'));
                    }
                    if ((x % 14 === 2 || x % 14 === 4) && x > 10 && x < levelLength - 20) {
                        this.tiles.push(new Tile(x * TILE_SIZE, GAME_HEIGHT - TILE_SIZE * 5, 'brick'));
                    }

                    // Pipes (Single & Tall)
                    if (x === 20 || x === 45 || x === 75 || x === 105) {
                        this.tiles.push(new Tile(x * TILE_SIZE, GAME_HEIGHT - TILE_SIZE * 3, 'pipe'));
                        this.tiles.push(new Tile(x * TILE_SIZE, GAME_HEIGHT - TILE_SIZE * 4, 'pipe'));
                        if (x === 75) {
                            this.tiles.push(new Tile(x * TILE_SIZE, GAME_HEIGHT - TILE_SIZE * 5, 'pipe'));
                        }
                    }

                    // End Goal Flagpole
                    if (x === levelLength - 10) {
                        for (let f = 3; f <= 11; f++) {
                            this.tiles.push(new Tile(x * TILE_SIZE, GAME_HEIGHT - TILE_SIZE * f, 'flag'));
                        }
                    }
                }
            }

            getTilesNear(x, y) {
                return this.tiles.filter(t => Math.abs(t.x - x) < 96 && Math.abs(t.y - y) < 96);
            }

            draw(ctx) {
                this.tiles.forEach(tile => tile.draw(ctx));
            }
        }

        // --- GLOBAL ARRAYS & GAME MANAGER ---
        let player = new Player(50, 100);
        let worldMap = new Map();
        let enemies = [];
        let items = [];
        let particles = [];
        let lakitus = [];

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push(new Particle(x, y, color, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6));
            }
        }

        function isColliding(r1, r2) {
            return !(r2.x >= r1.x + r1.width ||
                     r2.x + r2.width <= r1.x ||
                     r2.y >= r1.y + r1.height ||
                     r2.y + r2.height <= r1.y);
        }

        function startTimer() {
            clearInterval(timerInterval);
            gameTimer = 400;
            timerInterval = setInterval(() => {
                if (gameState === 'PLAYING') {
                    gameTimer--;
                    document.getElementById('timeText').innerText = String(gameTimer).padStart(3, '0');
                    if (gameTimer <= 0) {
                        playerHurt(true);
                    }
                }
            }, 1000);
        }

        function initGame() {
            score = 0;
            coins = 0;
            lives = 3;
            currentWorld = 1;
            currentSubLevel = 1;
            loadLevel(currentWorld, currentSubLevel);
        }

        function loadLevel(world, sublevel) {
            player = new Player(60, 200);
            worldMap.generate(world, sublevel);
            cameraX = 0;

            // Spawn Enemies according to sublevel
            enemies = [];
            const enemyCount = 6 + sublevel * 3;
            for (let i = 0; i < enemyCount; i++) {
                const enemyX = 350 + i * 220;
                const type = (i % 3 === 0 && sublevel > 1) ? 'spiny' : 'goomba';
                enemies.push(new Enemy(enemyX, 200, type));
            }

            // Spawn Lakitu in clouds
            lakitus = [new Lakitu(400, 60), new Lakitu(1200, 70)];

            items = [];
            particles = [];
            updateUI();
            startTimer();
        }

        function playerHurt(fatal = false) {
            if (player.invulnerableTimer > 0) return;

            if (player.isSuper && !fatal) {
                player.shrink();
            } else {
                lives--;
                Sound.hurt();
                updateUI();
                if (lives <= 0) {
                    gameOver();
                } else {
                    loadLevel(currentWorld, currentSubLevel);
                }
            }
        }

        function nextLevel() {
            gameState = 'LEVEL_WIN';
            Sound.win();

            currentSubLevel++;
            if (currentSubLevel > 4) {
                currentSubLevel = 1;
                currentWorld++;
            }

            document.getElementById('overlayTitle').innerText = "LEVEL CLEAR!";
            document.getElementById('overlaySubtitle').innerText = `Great Job! Next: World ${currentWorld}-${currentSubLevel}`;
            document.getElementById('startBtn').innerText = "NEXT LEVEL";
            document.getElementById('overlay').classList.remove('hidden');
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            clearInterval(timerInterval);
            document.getElementById('overlayTitle').innerText = "GAME OVER";
            document.getElementById('overlaySubtitle').innerText = `Final Score: ${score} | Coins: ${coins}`;
            document.getElementById('startBtn').innerText = "TRY AGAIN";
            document.getElementById('overlay').classList.remove('hidden');
        }

        function updateUI() {
            document.getElementById('scoreText').innerText = String(score).padStart(6, '0');
            document.getElementById('coinsText').innerText = String(coins).padStart(2, '0');
            document.getElementById('livesText').innerText = lives;
            document.getElementById('worldText').innerText = `${currentWorld}-${currentSubLevel}`;
        }

        // --- MAIN UPDATE & RENDER LOOP ---

        function update() {
            if (gameState !== 'PLAYING') return;

            player.update(worldMap);

            cameraX = Math.max(0, player.x - GAME_WIDTH / 3);

            worldMap.tiles.forEach(t => t.update());
            lakitus.forEach(l => l.update());

            items.forEach((item) => {
                item.update(worldMap);

                if (!item.collected && isColliding(player.getBounds(), item.getBounds())) {
                    if (item.type === 'coin') {
                        coins++;
                        score += 100;
                        Sound.coin();
                    } else if (item.type === 'mushroom') {
                        player.grow();
                        score += 1000;
                    }
                    item.collected = true;
                    updateUI();
                }
            });
            items = items.filter(i => !i.collected);
