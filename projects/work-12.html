<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סאונדבורד פסנתר, טראנס ובאסים מורחב</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap');
        
        body {
            font-family: 'Assistant', sans-serif;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .pad-btn {
            transition: transform 0.06s ease, box-shadow 0.06s ease, filter 0.06s ease;
        }
        .pad-btn:active, .pad-btn.active {
            transform: scale(0.92);
            filter: brightness(1.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8) !important;
        }

        @keyframes pulseLoop {
            0%, 100% { box-shadow: 0 0 12px rgba(168, 85, 247, 0.6); }
            50% { box-shadow: 0 0 25px rgba(168, 85, 247, 1); }
        }
        .looping {
            animation: pulseLoop 0.6s infinite;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between text-white p-2 sm:p-4">

    <!-- Header Navigation -->
    <header class="bg-slate-900/90 backdrop-blur-md border border-white/10 rounded-2xl px-4 py-2.5 flex justify-between items-center z-30 shadow-xl">
        <div class="flex items-center gap-3">
            <h1 class="text-lg sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-indigo-400 to-cyan-400 flex items-center gap-2">
                <i class="fa-solid fa-table-cells text-amber-400"></i> סאונדבורד פסנתר, טראנס ובאסים מורחב
            </h1>
        </div>

        <div class="flex items-center gap-3">
            <button id="stopAllBtn" class="bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center gap-1.5 border border-rose-400/30">
                <i class="fa-solid fa-stop"></i> עצור בלופים
            </button>
            <button id="soundToggle" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center gap-1.5 border border-white/10">
                <i id="soundIcon" class="fa-solid fa-volume-high text-emerald-400"></i>
                <span id="soundStatus">שמע פעיל</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area: Large Soundboard Pad Grid -->
    <main class="flex-1 my-2 flex flex-col gap-3 overflow-y-auto pr-1">
        
        <!-- Category 1: Numbers Row - Trance Loops & Arpeggios -->
        <section class="bg-slate-900/60 border border-purple-500/20 rounded-xl p-2.5 backdrop-blur-sm">
            <h2 class="text-xs sm:text-sm font-extrabold text-purple-400 mb-2 flex items-center gap-1.5">
                <i class="fa-solid fa-wand-magic-sparkles"></i> מקשי מספרים [1-8]: לופים של טראנס וארפג'יו
            </h2>
            <div id="tranceRow" class="grid grid-cols-4 sm:grid-cols-8 gap-2">
                <!-- Dynamically Generated -->
            </div>
        </section>

        <!-- Category 2: Upper Keys - Piano Notes -->
        <section class="bg-slate-900/60 border border-amber-500/20 rounded-xl p-2.5 backdrop-blur-sm">
            <h2 class="text-xs sm:text-sm font-extrabold text-amber-400 mb-2 flex items-center gap-1.5">
                <i class="fa-solid fa-music"></i> מקשי שורה עליונה [Q - I]: קלידי פסנתר אקוסטי
            </h2>
            <div id="pianoRow" class="grid grid-cols-4 sm:grid-cols-8 gap-2">
                <!-- Dynamically Generated -->
            </div>
        </section>

        <!-- Category 3: Home Keys - Lead Synths & Synth Notes -->
        <section class="bg-slate-900/60 border border-indigo-500/20 rounded-xl p-2.5 backdrop-blur-sm">
            <h2 class="text-xs sm:text-sm font-extrabold text-indigo-400 mb-2 flex items-center gap-1.5">
                <i class="fa-solid fa-bolt"></i> מקשי שורת בית [A - K]: צלילי ליד וסינת'
            </h2>
            <div id="synthRow" class="grid grid-cols-4 sm:grid-cols-8 gap-2">
                <!-- Dynamically Generated -->
            </div>
        </section>

        <!-- Category 4: Bottom Keys - Basses & Sub Drops -->
        <section class="bg-slate-900/60 border border-cyan-500/20 rounded-xl p-2.5 backdrop-blur-sm">
            <h2 class="text-xs sm:text-sm font-extrabold text-cyan-400 mb-2 flex items-center gap-1.5">
                <i class="fa-solid fa-drum-steelpan"></i> מקשי שורה תחתונה [Z - M]: באסים עמוקים ואפקטים
            </h2>
            <div id="bassRow" class="grid grid-cols-4 sm:grid-cols-7 gap-2">
                <!-- Dynamically Generated -->
            </div>
        </section>

    </main>

    <!-- Footer Bar -->
    <footer class="bg-slate-950/80 border border-white/10 rounded-xl p-2 px-4 flex justify-between items-center text-xs text-slate-400">
        <div>לחץ על כל מקש במקלדת או לחץ על הסאונדבורד לנגינה!</div>
        <div class="font-bold text-amber-400">31 מקשים פעילים במקלדת</div>
    </footer>

    <!-- Audio Synthesizer Engine -->
    <script>
        class AudioStudio {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.activeLoops = {};
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playPianoNote(freq) {
                if (this.muted) return;
                this.init();
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);

                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 1.2);
                } catch (e) { console.error(e); }
            }

            playSynthLead(freq) {
                if (this.muted) return;
                this.init();
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now);

                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.6);
                } catch (e) { console.error(e); }
            }

            playBassSound(type, freq = 65) {
                if (this.muted) return;
                this.init();
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    if (type === 'subdrop') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(180, now);
                        osc.frequency.exponentialRampToValueAtTime(25, now + 1.2);

                        gain.gain.setValueAtTime(0.9, now);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
                    } else if (type === 'punchy') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq * 1.5, now);
                        osc.frequency.exponentialRampToValueAtTime(freq, now + 0.3);

                        gain.gain.setValueAtTime(0.7, now);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
                    } else if (type === 'wobble') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now);

                        const filter = this.ctx.createBiquadFilter();
                        filter.type = 'lowpass';
                        filter.frequency.setValueAtTime(150, now);
                        filter.frequency.linearRampToValueAtTime(1000, now + 0.25);
                        filter.frequency.linearRampToValueAtTime(150, now + 0.5);

                        gain.gain.setValueAtTime(0.7, now);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);

                        osc.connect(filter);
                        filter.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.6);
                        return;
                    }

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 1.2);
                } catch (e) { console.error(e); }
            }

            toggleTrancePattern(id, notes, speedMs, buttonEl) {
                if (this.muted) return;
                this.init();

                if (this.activeLoops[id]) {
                    clearInterval(this.activeLoops[id]);
                    delete this.activeLoops[id];
                    buttonEl.classList.remove('looping');
                    return;
                }

                let step = 0;
                buttonEl.classList.add('looping');

                const interval = setInterval(() => {
                    if (this.muted) return;
                    const freq = notes[step % notes.length];
                    
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now);

                    gain.gain.setValueAtTime(0.28, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.15);

                    step++;
                }, speedMs);

                this.activeLoops[id] = interval;
            }

            stopAll() {
                Object.keys(this.activeLoops).forEach(id => {
                    clearInterval(this.activeLoops[id]);
                });
                this.activeLoops = {};
                document.querySelectorAll('.looping').forEach(el => el.classList.remove('looping'));
            }
        }

        const studio = new AudioStudio();
    </script>

    <!-- Pad Mapping Logic Script -->
    <script>
        const keyMap = {};

        // 1. Trance Loops Config [Keys 1-8]
        const trancePads = [
            { key: '1', name: 'טראנס 1', notes: [440, 523, 659, 523, 783, 659], speed: 140, color: 'from-purple-600 to-indigo-900', border: 'border-purple-400/30' },
            { key: '2', name: 'ארפג׳יו 2', notes: [523, 659, 783, 1046, 783, 659], speed: 120, color: 'from-purple-600 to-indigo-900', border: 'border-purple-400/30' },
            { key: '3', name: 'סייקידליק 3', notes: [220, 220, 440, 330, 220, 440], speed: 130, color: 'from-purple-600 to-indigo-900', border: 'border-purple-400/30' },
            { key: '4', name: 'קליימקס 4', notes: [659, 783, 880, 1046, 987, 880], speed: 140, color: 'from-purple-600 to-indigo-900', border: 'border-purple-400/30' },
            { key: '5', name: 'מהיר 5', notes: [880, 1046, 1318, 1046], speed: 100, color: 'from-purple-600 to-indigo-900', border: 'border-purple-400/30' },
            { key: '6', name: 'באס-טראנס 6', notes: [110, 220, 165, 220], speed: 150, color: 'from-purple-600 to-indigo-900', border: 'border-purple-400/30' },
            { key: '7', name: 'מלודי 7', notes: [349, 440, 523, 659], speed: 160, color: 'from-purple-600 to-indigo-900', border: 'border-purple-400/30' },
            { key: '8', name: 'דרמטי 8', notes: [293, 349, 440, 587], speed: 140, color: 'from-purple-600 to-indigo-900', border: 'border-purple-400/30' }
        ];

        // 2. Piano Row Config [Keys Q - I]
        const pianoPads = [
            { key: 'q', name: 'דו (C4)', freq: 261.63, color: 'from-amber-600 to-orange-800', border: 'border-amber-400/30' },
            { key: 'w', name: 'רמי (D4)', freq: 293.66, color: 'from-amber-600 to-orange-800', border: 'border-amber-400/30' },
            { key: 'e', name: 'מי (E4)', freq: 329.63, color: 'from-amber-600 to-orange-800', border: 'border-amber-400/30' },
            { key: 'r', name: 'פה (F4)', freq: 349.23, color: 'from-amber-600 to-orange-800', border: 'border-amber-400/30' },
            { key: 't', name: 'סול (G4)', freq: 392.00, color: 'from-amber-600 to-orange-800', border: 'border-amber-400/30' },
            { key: 'y', name: 'לה (A4)', freq: 440.00, color: 'from-amber-600 to-orange-800', border: 'border-amber-400/30' },
            { key: 'u', name: 'סי (B4)', freq: 493.88, color: 'from-amber-600 to-orange-800', border: 'border-amber-400/30' },
            { key: 'i', name: 'דו (C5)', freq: 523.25, color: 'from-amber-600 to-orange-800', border: 'border-amber-400/30' }
        ];

        // 3. Synth Leads Config [Keys A - K]
        const synthPads = [
            { key: 'a', name: 'סינת׳ A', freq: 440, color: 'from-indigo-600 to-blue-900', border: 'border-indigo-400/30' },
            { key: 's', name: 'סינת׳ S', freq: 493, color: 'from-indigo-600 to-blue-900', border: 'border-indigo-400/30' },
            { key: 'd', name: 'סינת׳ D', freq: 523, color: 'from-indigo-600 to-blue-900', border: 'border-indigo-400/30' },
            { key: 'f', name: 'סינת׳ F', freq: 587, color: 'from-indigo-600 to-blue-900', border: 'border-indigo-400/30' },
            { key: 'g', name: 'סינת׳ G', freq: 659, color: 'from-indigo-600 to-blue-900', border: 'border-indigo-400/30' },
            { key: 'h', name: 'סינת׳ H', freq: 698, color: 'from-indigo-600 to-blue-900', border: 'border-indigo-400/30' },
            { key: 'j', name: 'סינת׳ J', freq: 783, color: 'from-indigo-600 to-blue-900', border: 'border-indigo-400/30' },
            { key: 'k', name: 'סינת׳ K', freq: 880, color: 'from-indigo-600 to-blue-900', border: 'border-indigo-400/30' }
        ];

        // 4. Basses & Sub Config [Keys Z - M]
        const bassPads = [
            { key: 'z', name: 'סאב דרופ', type: 'subdrop', color: 'from-cyan-600 to-slate-900', border: 'border-cyan-400/30' },
            { key: 'x', name: 'באס פאנצ׳י 1', type: 'punchy', freq: 55, color: 'from-teal-600 to-emerald-950', border: 'border-teal-400/30' },
            { key: 'c', name: 'באס פאנצ׳י 2', type: 'punchy', freq: 65, color: 'from-teal-600 to-emerald-950', border: 'border-teal-400/30' },
            { key: 'v', name: 'וואבל Z', type: 'wobble', freq: 73, color: 'from-blue-600 to-slate-950', border: 'border-blue-400/30' },
            { key: 'b', name: 'וואבל X', type: 'wobble', freq: 82, color: 'from-blue-600 to-slate-950', border: 'border-blue-400/30' },
            { key: 'n', name: 'באס נמוך N', type: 'punchy', freq: 45, color: 'from-cyan-700 to-slate-950', border: 'border-cyan-400/30' },
            { key: 'm', name: 'דרופ כבד M', type: 'subdrop', color: 'from-cyan-700 to-slate-950', border: 'border-cyan-400/30' }
        ];

        // Function to Create Pad UI Component
        function createPad(container, item, triggerFn) {
            const btn = document.createElement('button');
            btn.className = `pad-btn bg-gradient-to-br ${item.color} hover:brightness-110 text-white rounded-xl p-2 sm:p-2.5 flex flex-col justify-between items-center text-center shadow-lg border ${item.border} h-20 sm:h-24 relative`;
            btn.innerHTML = `
                <span class="absolute top-1.5 right-1.5 text-xs font-black bg-black/40 px-1.5 py-0.5 rounded-md uppercase border border-white/20">${item.key}</span>
                <i class="fa-solid fa-music text-base sm:text-lg my-auto opacity-80"></i>
                <span class="font-bold text-xs truncate w-full">${item.name}</span>
            `;

            const action = () => {
                triggerFn(btn);
                btn.classList.add('active');
                setTimeout(() => btn.classList.remove('active'), 150);
            };

            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                action();
            });

            keyMap[item.key.toLowerCase()] = action;
            container.appendChild(btn);
        }

        // Render All Grids
        const tranceRow = document.getElementById('tranceRow');
        trancePads.forEach(p => createPad(tranceRow, p, (btn) => studio.toggleTrancePattern(p.key, p.notes, p.speed, btn)));

        const pianoRow = document.getElementById('pianoRow');
        pianoPads.forEach(p => createPad(pianoRow, p, () => studio.playPianoNote(p.freq)));

        const synthRow = document.getElementById('synthRow');
        synthPads.forEach(p => createPad(synthRow, p, () => studio.playSynthLead(p.freq)));

        const bassRow = document.getElementById('bassRow');
        bassPads.forEach(p => createPad(bassRow, p, () => studio.playBassSound(p.type, p.freq)));

        // Stop All Button
        document.getElementById('stopAllBtn').addEventListener('click', () => studio.stopAll());

        // Keyboard Event Listener
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const key = e.key.toLowerCase();
            if (keyMap[key]) {
                keyMap[key]();
            }
        });

        // Sound Mute Toggle
        const soundToggle = document.getElementById('soundToggle');
        const soundIcon = document.getElementById('soundIcon');
        const soundStatus = document.getElementById('soundStatus');

        soundToggle.addEventListener('click', () => {
            studio.muted = !studio.muted;
            if (studio.muted) {
                studio.stopAll();
                soundIcon.className = 'fa-solid fa-volume-xmark text-rose-400';
                soundStatus.innerText = 'מושתק';
            } else {
                soundIcon.className = 'fa-solid fa-volume-high text-emerald-400';
                soundStatus.innerText = 'שמע פעיל';
            }
        });

        // Global User Interaction Unlock
        document.body.addEventListener('click', () => studio.init(), { once: true });
    </script>
</body>
</html>
